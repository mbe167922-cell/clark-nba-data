# Nightly NBA recording: live scores from several free feeds and Kalshi's public game-winner prices, side by
# side on one clock, for latency research. Public data only; nothing here places, sizes or suggests a trade.
#   tools/recorder.py   ESPN scoreboard + each live game's Kalshi orderbook every 2 s  -> data/nba-YYYYMMDD.jsonl.gz
#   tools/feed_race.py  ESPN scoreboard, ESPN core API, NBA live data, Kalshi orderbook every 1 s -> data/race-YYYYMMDD.jsonl.gz
#   tools/halftime_books.py three sportsbooks' moneylines + Kalshi orderbook while a game is at halftime (NB-032, paper
#                       research; The Odds API free key in secret ODDS_API_KEY, never printed) -> data/books-YYYYMMDD.jsonl.gz
#   tools/trades_bundle.py  the night's Kalshi trade prints (time, price) for each recorded game -> data/trades-YYYYMMDD.json.gz
# Each run records until every game is final (or 5.5 h) and commits the night's files; runs start six times a day.
name: Record NBA night

on:
  schedule:   # GitHub fires crons up to hours late (10-22: 6:40 PM fired 8:54 PM, 11:30 PM fired 4:45 AM), so start
              # often: each run records up to 5.5 h; the concurrency group queues the next one, so runs chain
    - cron: "0 16 * * *"    # noon EDT (weekend matinees)
    - cron: "0 19 * * *"    # 3 PM EDT
    - cron: "0 22 * * *"    # 6 PM EDT; most tip-offs are 7:00-10:30 PM ET
    - cron: "0 0 * * *"     # 8 PM EDT
    - cron: "0 2 * * *"     # 10 PM EDT
    - cron: "0 4 * * *"     # midnight EDT: finishes late games
  workflow_dispatch:
    inputs:
      hours:
        description: "hours to record (capped at 5.5: GitHub kills a job at 6 h, before it can save)"
        default: "5.5"
      check_key:
        description: "only check the Odds API key (free call, no recording)"
        type: boolean
        default: false

concurrency:
  group: record
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check the Odds API key only (costs no credit)
        if: ${{ github.event.inputs.check_key == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python tools/halftime_books.py check
      - name: Record (the recorders in parallel)
        if: ${{ github.event.inputs.check_key != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # the slate's date: a run that starts after midnight ET (late or queued) still belongs to last night
          DAY=$(TZ=America/New_York date -d '-6 hours' +%Y%m%d)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          H="${{ github.event.inputs.hours || '5.5' }}"
          H=$(python -c "print(min(float('$H'), 5.5))")   # 10-22: a 6 h run hit GitHub's 6 h limit and lost the night
          python tools/recorder.py --hours "$H" --every 2 --date "$DAY" --out "data/nba-$DAY.jsonl.gz" & P1=$!
          python tools/feed_race.py record --hours "$H" --date "$DAY" --out "data/race-$DAY.jsonl.gz" & P2=$!
          python tools/halftime_books.py record --hours "$H" --date "$DAY" --out "data/books-$DAY.jsonl.gz" & P3=$!
          set +e   # a bare `wait` returns 0 even when a recorder failed: wait for each one and keep its exit code
          wait $P1; S1=$?
          wait $P2; S2=$?
          wait $P3; S3=$?
          echo "RECORDER_EXIT=$S1" >> "$GITHUB_ENV"
          echo "FEED_RACE_EXIT=$S2" >> "$GITHUB_ENV"
          echo "BOOKS_EXIT=$S3" >> "$GITHUB_ENV"
          echo "recorder exit $S1, feed_race exit $S2, halftime_books exit $S3"
      - name: Pack the night's Kalshi trades (Kalshi refuses Claude's cloud, so the analyst reads them from here)
        if: ${{ always() && github.event.inputs.check_key != 'true' }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          [ -f "data/nba-$DAY.jsonl.gz" ] || { echo "no recording"; exit 0; }
          set +e
          timeout 600 python tools/trades_bundle.py pack "data/nba-$DAY.jsonl.gz" "$DAY" "data/trades-$DAY.json.gz"
          S=$?
          echo "PACK_EXIT=$S" >> "$GITHUB_ENV"
          [ "$S" = 0 ] || echo "trade pack failed with exit $S (recording still saved)"
      - name: Commit the night's files and this run's exit statuses (retries if main moved)
        if: ${{ always() && github.event.inputs.check_key != 'true' }}
        run: |
          [ -n "$DAY" ] || DAY=$(TZ=America/New_York date -d '-6 hours' +%Y%m%d)
          # one line per run: the nightly analyst reports any non-zero exit (null = the step never finished)
          echo "{\"run\": \"$GITHUB_RUN_ID\", \"attempt\": \"$GITHUB_RUN_ATTEMPT\", \"ended_utc\": \"$(date -u +%FT%TZ)\", \"recorder_exit\": ${RECORDER_EXIT:-null}, \"feed_race_exit\": ${FEED_RACE_EXIT:-null}, \"pack_exit\": ${PACK_EXIT:-null}, \"books_exit\": ${BOOKS_EXIT:-null}}" >> "data/status-$DAY.jsonl"
          git config user.name "nba-recorder"
          git config user.email "nba-recorder@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/keep" && cp data/*-"$DAY".* "$RUNNER_TEMP/keep/"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP"/keep/* data/
            git add data/
            git diff --cached --quiet && { echo "nothing changed"; exit 0; }
            git commit -q -m "Recording $DAY ($(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET)"
            git push -q origin HEAD:main && { echo "pushed"; exit 0; }
            echo "push rejected; redoing on the latest main"
            sleep 10
          done
          exit 1
      - name: Fail the run if a recorder failed (after the files and statuses are saved)
        if: ${{ always() && github.event.inputs.check_key != 'true' }}
        run: |
          echo "recorder=${RECORDER_EXIT:-none} feed_race=${FEED_RACE_EXIT:-none} pack=${PACK_EXIT:-none} books=${BOOKS_EXIT:-none}"
          [ "${RECORDER_EXIT:-1}" = 0 ] && [ "${FEED_RACE_EXIT:-1}" = 0 ] && [ "${BOOKS_EXIT:-1}" = 0 ] || { echo "a recorder exited non-zero"; exit 1; }
